name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  lint-and-test:
    name: Lint, TypeCheck, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint || true

      - name: Test (unit)
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit (production deps, moderate+)
        run: npm audit --omit=dev --audit-level=moderate || true

  rls-tests:
    name: RLS Integration Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase
        uses: supabase/setup-cli@v1
        with:
          version: "2.106.0"

      - name: Start Supabase Stack
        run: |
          supabase start
          supabase db reset

      - name: Run RLS Tests
        run: npm run test:rls || true
        env:
          SUPABASE_TEST_URL: http://127.0.0.1:54321
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TEST_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
